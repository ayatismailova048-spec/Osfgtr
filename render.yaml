# Blueprint для Render: https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: domashnie-dela
    runtime: node
    plan: starter            # нужен платный план: диск для данных и работа без засыпания
    rootDir: app
    branch: ccr-592f80d4-v1bovu
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /schedule.js
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: TZ_NAME
        value: Europe/Moscow
      - key: PARENTS
        value: Мама,Папа        # имена родителей через запятую
      - key: ADMIN_KEY
        generateValue: true     # пароль для страницы /admin со ссылками
