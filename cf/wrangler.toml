name = "domashnie-dela"
main = "src/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "domashnie-dela"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["*/5 * * * *"]
