<title>Домашние дела</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky header with tabs, then a 4-person grid for the day, a week table, and a rules table. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#16202a; --muted:#5d6b78; --line:#dde3e8;
  --accent:#0f6f68; --accent-soft:#d9efec; --ok:#1f7a45; --ok-soft:#dff3e6;
  --p0:#2563c9; --p1:#b4237a; --p2:#b45f06; --p3:#2a7d2e;
  --p0s:#e1ebfb; --p1s:#f7e1ef; --p2s:#f8ead7; --p3s:#e0f1e0;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171d; --surface:#1a232c; --ink:#e8eef3; --muted:#9aa9b6; --line:#2c3944;
  --accent:#4fc4ba; --accent-soft:#17383a; --ok:#6fd195; --ok-soft:#1b3a28;
  --p0:#7fb0ff; --p1:#f08cc6; --p2:#f0b068; --p3:#8fd88f;
  --p0s:#1b2a45; --p1s:#41203a; --p2s:#40301a; --p3s:#1d3a20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#1a232c; --ink:#e8eef3; --muted:#9aa9b6; --line:#2c3944;
  --accent:#4fc4ba; --accent-soft:#17383a; --ok:#6fd195; --ok-soft:#1b3a28;
  --p0:#7fb0ff; --p1:#f08cc6; --p2:#f0b068; --p3:#8fd88f;
  --p0s:#1b2a45; --p1s:#41203a; --p2s:#40301a; --p3s:#1d3a20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
header{padding-block:18px 10px}
h1{font:700 26px/1.1 var(--display);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
nav.tabs{display:flex;gap:6px;margin-block:14px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201e}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font:700 20px/1.2 var(--display);margin:0;flex:1;min-width:180px}
.nbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.today-pill{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.name{font:700 18px/1.2 var(--display)}
.pts{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:10px}
.meter i{display:block;height:100%;width:0;transition:width .25s}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:8px;cursor:pointer;min-height:44px}
.task:hover{background:var(--bg)}
.task input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.task span.t{flex:1;min-width:0}
.task .b{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.task.done span.t{text-decoration:line-through;color:var(--muted)}
.status{font-size:13px;color:var(--muted);margin-top:12px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:600 13px var(--body);color:var(--muted);background:var(--bg)}
td.day{white-space:nowrap;font-weight:600}
td.day small{display:block;font-weight:400;color:var(--muted)}
tr.now td{background:var(--accent-soft)}
tr.now td.day{box-shadow:inset 3px 0 0 var(--accent)}
.chip{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:6px;font-size:13px}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.75}
.hd{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.note{color:var(--muted);font-size:13px;margin:12px 0 0;max-width:70ch}
.rules td.n{font-variant-numeric:tabular-nums}
@media (max-width:520px){h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

<div class="wrap">
<header>
  <h1>Домашние дела</h1>
  <p class="sub">Четыре человека, по 6 баллов в день каждому. Ответственные меняются по кругу каждую неделю.</p>
</header>
<nav class="tabs" role="tablist" aria-label="Разделы">
  <button class="tab" role="tab" id="tab-today" aria-selected="true" data-v="today">Сегодня</button>
  <button class="tab" role="tab" id="tab-week" aria-selected="false" data-v="week">Неделя</button>
  <button class="tab" role="tab" id="tab-rules" aria-selected="false" data-v="rules">Задания и баллы</button>
</nav>
<main id="view"></main>
</div>

<script>
const PEOPLE=[["Хамдия","p0"],["Ханифа","p1"],["Хаммад","p2"],["Аят","p3"]];
const TASKS={
  dish:["Мытьё посуды",6], trash:["Выброс мусора",1], water:["Принести воды",2], vac:["Пылесос",2],
  cat:["Уход за кошкой",1], table:["Уборка стола",2], sink:["Мытьё раковин, туалета, зеркал, сантехники",3],
  laundry:["Развешивание белья и глажка",1], room:["Уборка в своей комнате",2],
  cook:["Готовка еды и хлеб",3], fridge:["Мытьё холодильника, уборка поверхностей",2]};
const ORDER=["dish","cook","sink","vac","fridge","water","table","room","laundry","cat","trash"];
// Шаблон недели: день (Пн..Вс) -> 4 набора задач ("позиции"). Позиции сдвигаются между людьми каждую неделю.
const SCHEDULE=[
 [['dish'],['table','fridge','room'],['water','vac','trash','laundry'],['cook','room','cat']],
 [['cook','room','trash'],['sink','fridge','cat'],['dish'],['water','table','room']],
 [['dish'],['water','vac','room'],['table','room','trash','cat'],['cook','room','laundry']],
 [['water','fridge','room'],['cook','room','cat'],['dish'],['sink','table','trash']],
 [['water','room','cat','laundry'],['cook','room','trash'],['table','vac','room'],['dish']],
 [['water','table','room'],['dish'],['vac','room','trash','cat'],['cook','sink']],
 [['sink','water','cat'],['dish'],['table','fridge','room'],['cook','room','trash']]];
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const REF=new Date(2026,10,16); // понедельник первой недели

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
const dow=d=>(d.getDay()+6)%7;
const monday=d=>addDays(d,-dow(d));
const weekIdx=d=>Math.round((monday(d)-REF)/(7*864e5));
const fmt=d=>d.getDate()+" "+MONTHS[d.getMonth()];
// Кто в какой позиции: позиция s в неделе w достаётся человеку (s+w) mod 4
function assign(d){
  const w=weekIdx(d),sched=SCHEDULE[dow(d)];
  return PEOPLE.map((_,p)=>{const s=(((p-w)%4)+4)%4;return sched[s];});
}
const sumPts=l=>l.reduce((a,k)=>a+TASKS[k][1],0);

// ---- состояние отметок ----
let done=new Set(); let shared=false, dbCol=null, loadNote="";
try{JSON.parse(localStorage.getItem("done")||"[]").forEach(k=>done.add(k))}catch(e){}
const saveLocal=()=>{try{localStorage.setItem("done",JSON.stringify([...done]))}catch(e){}};
const key=(d,p,t)=>iso(d)+"_"+p+"_"+t;

let view="today", cur=new Date(); cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());
const today=new Date(cur);
try{const v=localStorage.getItem("view"); if(["today","week","rules"].includes(v)) view=v}catch(e){}

function toggle(k,on){
  on?done.add(k):done.delete(k); saveLocal(); render();
  if(dbCol){const r=dbCol.doc(k); (on?r.set({v:1}):r.delete()).catch(()=>{loadNote="Не удалось отправить отметку другим. Она сохранена только на этом устройстве.";render()});}
}

function personTasks(d,p,list){
  return list.map(t=>{
    const k=key(d,p,t), on=done.has(k);
    return `<label class="task${on?" done":""}"><input type="checkbox" data-k="${k}" ${on?"checked":""}><span class="t">${TASKS[t][0]}</span><span class="b">${TASKS[t][1]}</span></label>`;
  }).join("");
}
function renderToday(){
  const a=assign(cur), isT=iso(cur)===iso(today);
  let h=`<div class="bar"><button class="nbtn" data-nav="-1" aria-label="Предыдущий день">←</button>
   <h2>${DAYS[dow(cur)]}, ${fmt(cur)}${isT?'<span class="today-pill">сегодня</span>':''}</h2>
   ${isT?"":'<button class="nbtn" data-nav="0">К сегодняшнему дню</button>'}
   <button class="nbtn" data-nav="1" aria-label="Следующий день">→</button></div><div class="grid">`;
  a.forEach((list,p)=>{
    const total=sumPts(list), got=list.filter(t=>done.has(key(cur,p,t))).reduce((s,t)=>s+TASKS[t][1],0);
    const c=PEOPLE[p][1];
    h+=`<section class="card"><div class="who"><span class="name" style="color:var(--${c})">${PEOPLE[p][0]}</span><span class="pts">${got} из ${total} баллов</span></div>
      <div class="meter"><i style="width:${got/total*100}%;background:var(--${c})"></i></div>${personTasks(cur,p,list)}</section>`;
  });
  h+=`</div><p class="status">${shared?"Отметки видны всем, у кого открыта эта страница.":"Отметки хранятся на этом устройстве."} ${loadNote}</p>`;
  return h;
}
function renderWeek(){
  const m=monday(cur);
  let h=`<div class="bar"><button class="nbtn" data-wk="-1" aria-label="Предыдущая неделя">←</button>
   <h2>Неделя ${fmt(m)} – ${fmt(addDays(m,6))}</h2>
   <button class="nbtn" data-wk="0">Эта неделя</button><button class="nbtn" data-wk="1" aria-label="Следующая неделя">→</button></div>
   <div class="scroll"><table><thead><tr><th>День</th>${PEOPLE.map(p=>`<th><span class="hd"><i class="dot" style="background:var(--${p[1]})"></i>${p[0]}</span></th>`).join("")}</tr></thead><tbody>`;
  for(let i=0;i<7;i++){
    const d=addDays(m,i), a=assign(d), now=iso(d)===iso(today);
    h+=`<tr class="${now?"now":""}"><td class="day">${SHORT[i]}<small>${fmt(d)}${now?" · сегодня":""}</small></td>`;
    a.forEach((list,p)=>{
      h+="<td>"+list.map(t=>{const on=done.has(key(d,p,t));
        return `<span class="chip" style="background:var(--${PEOPLE[p][1]}s);color:var(--${PEOPLE[p][1]});${on?"text-decoration:line-through;opacity:.6":""}">${TASKS[t][0]}<b>${TASKS[t][1]}</b></span>`}).join("")+"</td>";
    });
    h+="</tr>";
  }
  return h+`</tbody></table></div><p class="note">Число рядом с заданием показывает баллы. Каждый человек получает ровно 6 баллов в день. Со следующей недели все сдвигаются на один шаг по кругу: у каждого меняются дни мытья посуды и остальные задания.</p>`;
}
function renderRules(){
  const cnt={};ORDER.forEach(t=>cnt[t]=[]);
  SCHEDULE.forEach((day,i)=>{const seen={};day.forEach(g=>g.forEach(t=>{seen[t]=(seen[t]||0)+1}));Object.keys(seen).forEach(t=>cnt[t].push({i,n:seen[t]}))});
  let tot=0;
  const rows=ORDER.map(t=>{const times=cnt[t].reduce((s,x)=>s+x.n,0);tot+=times*TASKS[t][1];
    const days=cnt[t].map(x=>SHORT[x.i]).join(", ");
    const note=t==="room"?"каждый убирает свою комнату, 4 раза в неделю":days;
    return `<tr><td>${TASKS[t][0]}</td><td class="n">${TASKS[t][1]}</td><td class="n">${t==="room"?"4 у каждого":times}</td><td>${t==="room"?"каждый день у кого-то, по очереди":days}</td></tr>`}).join("");
  return `<div class="bar"><h2>Задания и баллы</h2></div><div class="scroll rules"><table><thead><tr><th>Задание</th><th>Баллы</th><th>Раз в неделю</th><th>Дни</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">За неделю набирается ${tot} баллов: 4 человека × 6 баллов × 7 дней. Если нужно поменять частоту или баллы, скажи, и я пересчитаю расписание.</p>`;
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  const el=document.getElementById("view");
  el.innerHTML=view==="today"?renderToday():view==="week"?renderWeek():renderRules();
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(t){view=t.dataset.v;try{localStorage.setItem("view",view)}catch(x){}render();return}
  const n=e.target.closest("[data-nav]"); if(n){const v=+n.dataset.nav;cur=v===0?new Date(today):addDays(cur,v);render();return}
  const w=e.target.closest("[data-wk]"); if(w){const v=+w.dataset.wk;cur=v===0?new Date(today):addDays(cur,7*v);render();return}
});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)toggle(k,e.target.checked)});
render();

// ---- общая база отметок (если доступна) ----
(async()=>{
  try{
    const db=await (window.claude&&claude.use?claude.use("db"):null); if(!db)return;
    const col=db.collection("done"); dbCol=col; shared=true;
    const timer=setTimeout(()=>{loadNote="Общие отметки пока не загрузились.";render()},10000);
    col.onSnapshot(s=>{clearTimeout(timer);loadNote="";
      done=new Set(s.docs.map(d=>d.id)); saveLocal(); render();
    },()=>{clearTimeout(timer);shared=false;dbCol=null;render()});
  }catch(e){}
})();
</script>
